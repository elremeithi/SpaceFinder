name: Build SpaceFinder.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller send2trash
      - run: python -m unittest discover tests
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name SpaceFinder --uac-admin --hidden-import send2trash main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceFinder-exe
          path: dist/SpaceFinder.exe
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/SpaceFinder.exe --title "Space Finder (latest build)" \
            --notes "Download SpaceFinder.exe below. Single file, no install, works fully offline. Built from ${GITHUB_SHA::7}."
