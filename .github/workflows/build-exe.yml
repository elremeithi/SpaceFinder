name: Build SpaceFinder.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller send2trash
      - run: python -m unittest discover tests
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name SpaceFinder --uac-admin --hidden-import send2trash main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceFinder-exe
          path: dist/SpaceFinder.exe
